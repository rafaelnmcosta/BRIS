services:
  # Serviço para a API .NET
  api:
    build:
      context: ./bris-API
      dockerfile: Dockerfile
    ports:
      - "5000:80" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Production  # ambiente para a api
    depends_on:
      - db
    networks:
      - bris-net

# Serviço de migrations
  migrations:
    image: mcr.microsoft.com/dotnet/sdk:8.0  # Usando a imagem do SDK do .NET
    working_dir: /src
    volumes:
      - ./bris-API:/src  # Montando o diretório da API no container
    entrypoint: ["dotnet", "tool", "install", "--global", "dotnet-ef"]  # Instalar a ferramenta dotnet-ef
    command: ["dotnet-ef", "database", "update"]  # Rodar as migrations
    environment:
      - ASPNETCORE_ENVIRONMENT=${MODE:-Production}
    depends_on:
      - db
    networks:
      - bris-net
  # Serviço para o Frontend React
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "5432:80" 
    environment:
      - NODE_ENV=production # ambiente para o frontend
    networks:
      - bris-net

  # Serviço para o banco de dados PostgreSQL
  db:
    image: postgres:15.7
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bris_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bris-net

networks:
  bris-net:
    driver: bridge

volumes:
  postgres_data:
