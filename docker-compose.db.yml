services:
  # Serviço para o banco de dados PostgreSQL
  db:
    image: postgres:15.7
    container_name: software_rural_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      USER_BRIS: ${USER_BRIS}
      PASSWORD_BRIS: ${PASSWORD_BRIS}
      USER_IMPERIUM: ${USER_IMPERIUM}
      PASSWORD_IMPERIUM: ${PASSWORD_IMPERIUM}
    volumes:
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh
      - ${DATA_VOLUME_PATH}:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - software-rural-net

pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER}  # Email de login do pgAdmin
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}  # Senha de login do pgAdmin
    ports:
      - "5050:80"  # Mapeia a porta 5050 do host para a porta 80 do container (pgAdmin)
    volumes:
      - /home/iury/docker/pgadmin:/var/lib/pgadmin  # Persistência de dados
    networks:
      - software-rural-net
    depends_on:
      - db  # Espera o banco de dados estar disponível antes de iniciar

networks:
  software-rural-net:
    driver: bridge
    name: software-rural-net
