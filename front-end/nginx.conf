worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    include       mime.types;
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 443 ssl;
        server_name localhost;

        # Caminho para seus certificados SSL
        ssl_certificate /path/to/certificate.pem;
        ssl_certificate_key /path/to/private-key.pem;

        location / {
            # Redireciona para o frontend React
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy reverso para a API (backend)
        location /api/ {
            proxy_pass http://api:5000/;  # Nome do serviço de API no Docker Compose
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirecionamento para o Swagger
        location /swagger/ {
            proxy_pass http://api:5000/swagger/;
            proxy_set_header Host $host;
        }
    }

}
